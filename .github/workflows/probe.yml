name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - run: |
          flatpak --version; flatpak-builder --version; ostree --version | head -2
          cat /etc/os-release | head -3
