name: build-and-publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 每天 05:00 CST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download WPS deb (signed CDN URL)
        run: bash scripts/fetch-wps.sh

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Build all apps into one ostree repo
        run: |
          set -e
          # flathub-infra 镜像缺 machine-id，flatpak-builder 起 dbus/rofiles-fuse 会炸
          mkdir -p /var/lib/dbus && dbus-uuidgen --ensure=/etc/machine-id 2>/dev/null || systemd-machine-id-setup
          KEYID=2EBACB345EEE12989141A60FBE75E703425025BA
          # build-sign/build-update-repo 默认用临时空 keyring，必须显式指向真实 homedir
          GHOME=$(gpgconf --list-dirs homedir)
          echo "GPG homedir: $GHOME"
          for m in manifests/*.yaml; do
            echo "=== building $m ==="
            flatpak-builder --disable-rofiles-fuse --state-dir=/tmp/fb --repo=ostree-repo --force-clean /tmp/build "$m"
          done
          for ref in $(ostree --repo=ostree-repo refs | grep '^app/'); do
            appid=$(echo "$ref" | cut -d/ -f2)
            flatpak build-sign --gpg-homedir="$GHOME" --gpg-sign=$KEYID ostree-repo "$appid"
          done
          flatpak build-update-repo --gpg-homedir="$GHOME" --generate-static-deltas --gpg-sign=$KEYID ostree-repo
          # 旧的 appstream/x86_64 分支（扁平化前遗留）build-update-repo 不签名，现代客户端也不用它：直接删除
          ostree --repo=ostree-repo refs --delete appstream/x86_64 2>/dev/null || true
          flatpak build-update-repo --gpg-homedir="$GHOME" --generate-static-deltas --gpg-sign=$KEYID --no-update-appstream ostree-repo
          # 校验：每个 ref 的 commit 必须有 .commitmeta（GPG 签名），否则客户端拒绝拉取
          # appstream2 不是 app 形态，build-sign 签不了：临时挂一个 app ref 指向同一 commit，
          # 签完再删（签名是挂在 commit 对象上的，与 ref 无关）
          for ref in $(ostree --repo=ostree-repo refs); do
            c=$(ostree --repo=ostree-repo rev-parse "$ref")
            f="ostree-repo/objects/${c:0:2}/${c:2}.commitmeta"
            if [ -f "$f" ]; then echo "signed ✓ $ref -> $c"; continue; fi
            echo "signing ref $ref (commit $c) via temp app ref"
            ostree --repo=ostree-repo refs --create app/org.Sign.Tmp/x86_64/master "$c"
            flatpak build-sign --gpg-homedir="$GHOME" --gpg-sign=$KEYID ostree-repo org.Sign.Tmp
            ostree --repo=ostree-repo refs --delete app/org.Sign.Tmp/x86_64/master
            if [ -f "$f" ]; then echo "signed ✓ $ref -> $c"; else echo "UNSIGNED ✗ $ref -> $c"; exit 1; fi
          done
          flatpak build-update-repo --gpg-homedir="$GHOME" --generate-static-deltas --gpg-sign=$KEYID --no-update-appstream ostree-repo
          ostree --repo=ostree-repo refs

      - uses: actions/upload-artifact@v4
        with:
          name: ostree-repo
          path: ostree-repo/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ostree-repo
          path: ostree-repo/

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: "10"
        run: |
          set -euo pipefail
          # R2 对同对象高并发 PUT 会返回 ServiceUnavailable（曾导致 delta part 丢失 → 客户端 404）
          aws configure set default.s3.max_concurrent_requests 4
          aws configure set default.s3.max_queue_size 1000
          aws configure set default.retry_mode adaptive
          aws configure set default.max_attempts 10
          # 先传 summary 之外的其余对象，最后才传 summary：客户端在新对象齐备前拿不到新 summary，
          # 避免出现"新 summary 引用了还没上传的 delta part"（曾导致 404）
          aws s3 sync ostree-repo/ "s3://${{ secrets.R2_BUCKET }}/repo/" \
            --exclude "summary" --exclude "summary.sig" --exclude "config" \
            --only-show-errors
          aws s3 cp ostree-repo/config "s3://${{ secrets.R2_BUCKET }}/repo/config" --only-show-errors
          aws s3 cp mikesolar.flatpakrepo "s3://${{ secrets.R2_BUCKET }}/mikesolar.flatpakrepo" \
            --content-type "application/vnd.flatpak.repo" --only-show-errors
          aws s3 cp ostree-repo/summary "s3://${{ secrets.R2_BUCKET }}/repo/summary" --only-show-errors
          aws s3 cp ostree-repo/summary.sig "s3://${{ secrets.R2_BUCKET }}/repo/summary.sig" --only-show-errors

      - name: Verify upload (nothing left to upload = everything is there)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          # dryrun 只能当"候选"：R2 的 ListObjects 有延迟，刚传完可能列表里看不到。
          # 对每个候选用 head-object 复核，只有真 404 才算缺。
          aws s3 sync ostree-repo/ "s3://${{ secrets.R2_BUCKET }}/repo/" --dryrun --only-show-errors > /tmp/pending.txt || true
          n=$(grep -c 'upload:' /tmp/pending.txt || true)
          echo "candidates: ${n:-0}"
          missing=0
          while IFS= read -r line; do
            key=$(printf '%s' "$line" | sed -n 's/.*upload: ostree-repo\/\(.*\) to s3:.*/\1/p')
            [ -z "$key" ] && continue
            if ! aws s3api head-object --bucket "${{ secrets.R2_BUCKET }}" --key "repo/$key" >/dev/null 2>&1; then
              echo "MISSING $key"; missing=$((missing+1))
            fi
          done < /tmp/pending.txt
          if [ "$missing" -ne 0 ]; then
            echo "::error::上传不完整，远端缺 $missing 个对象"
            exit 1
          fi
          echo "all objects present"
