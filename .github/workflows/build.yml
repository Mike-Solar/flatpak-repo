name: build-and-publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 每天 05:00 CST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download WPS deb (signed CDN URL)
        run: bash scripts/fetch-wps.sh

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Build all apps into one ostree repo
        run: |
          set -e
          # flathub-infra 镜像缺 machine-id，flatpak-builder 起 dbus/rofiles-fuse 会炸
          mkdir -p /var/lib/dbus && dbus-uuidgen --ensure=/etc/machine-id 2>/dev/null || systemd-machine-id-setup
          KEYID=2EBACB345EEE12989141A60FBE75E703425025BA
          for m in manifests/*.yaml; do
            echo "=== building $m ==="
            flatpak-builder --disable-rofiles-fuse --state-dir=/tmp/fb --repo=ostree-repo --force-clean /tmp/build "$m"
          done
          for ref in $(ostree --repo=ostree-repo refs | grep '^app/'); do
            appid=$(echo "$ref" | cut -d/ -f2)
            flatpak build-sign --gpg-sign=$KEYID ostree-repo "$appid"
          done
          flatpak build-update-repo --generate-static-deltas --gpg-sign=$KEYID ostree-repo
          # appstream2 等元数据 ref 是 build-update-repo 才生成的，按 commit 全量补签；
          # 第二次更新只刷新 summary（--no-update-appstream），否则会把刚签的 appstream2 换掉
          for ref in $(ostree --repo=ostree-repo refs); do
            ostree --repo=ostree-repo sign --gpg-sign=$KEYID "$(ostree --repo=ostree-repo rev-parse "$ref")"
          done
          flatpak build-update-repo --generate-static-deltas --gpg-sign=$KEYID --no-update-appstream ostree-repo
          for ref in $(ostree --repo=ostree-repo refs); do
            echo "$ref -> $(ostree --repo=ostree-repo rev-parse "$ref")"
            ostree --repo=ostree-repo commitmeta "$(ostree --repo=ostree-repo rev-parse "$ref")" >/dev/null && echo "  signed ✓"
          done
          ostree --repo=ostree-repo refs

      - uses: actions/upload-artifact@v4
        with:
          name: ostree-repo
          path: ostree-repo/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ostree-repo
          path: ostree-repo/

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          aws s3 sync ostree-repo/ "s3://${{ secrets.R2_BUCKET }}/repo/"
          aws s3 cp mikesolar.flatpakrepo "s3://${{ secrets.R2_BUCKET }}/mikesolar.flatpakrepo" \
            --content-type "application/vnd.flatpak.repo"
