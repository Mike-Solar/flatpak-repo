name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download WPS deb (signed CDN URL)
        run: bash scripts/fetch-wps.sh

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Build all apps into one ostree repo
        run: |
          set -e
          KEYID=2EBACB345EEE12989141A60FBE75E703425025BA
          for m in manifests/*.yaml; do
            echo "=== building $m ==="
            flatpak-builder --state-dir=/tmp/fb --repo=ostree-repo --force-clean /tmp/build "$m"
          done
          for ref in $(ostree --repo=ostree-repo refs | grep '^app/'); do
            appid=$(echo "$ref" | cut -d/ -f2)
            flatpak build-sign --gpg-sign=$KEYID ostree-repo "$appid"
          done
          flatpak build-update-repo --generate-static-deltas --gpg-sign=$KEYID ostree-repo
          ostree --repo=ostree-repo refs

      - uses: actions/upload-artifact@v4
        with:
          name: ostree-repo
          path: ostree-repo/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ostree-repo
          path: ostree-repo/

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          aws s3 sync ostree-repo/ "s3://${{ secrets.R2_BUCKET }}/repo/"
          aws s3 cp mikesolar.flatpakrepo "s3://${{ secrets.R2_BUCKET }}/mikesolar.flatpakrepo" \
            --content-type "application/vnd.flatpak.repo"
