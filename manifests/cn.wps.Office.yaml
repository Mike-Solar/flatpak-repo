app-id: cn.wps.Office
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: wps
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.a11y.Bus

modules:
  - name: wps-office
    buildsystem: simple
    build-commands:
      - ar x wps.deb
      - tar -xf data.tar.xz
      - install -d /app/opt /app/bin /app/share/applications
        /app/share/icons/hicolor/48x48/apps /app/share/metainfo
      - cp -r opt/kingsoft /app/opt/
      # 包装脚本指向 /app 下的安装路径
      - for b in wps et wpp wpspdf; do sed 's|/opt/kingsoft/wps-office|/app/opt/kingsoft/wps-office|g'
        usr/bin/$b > /app/bin/$b; chmod 755 /app/bin/$b; done
      # desktop 文件重命名为 app-id 前缀（prometheus=合并模式主入口，et/wpp/pdf 为组件）
      - |
        for c in prometheus et wpp pdf; do
          case $c in prometheus) suffix="";; *) suffix=".$c";; esac; \
          sed -e "s|^Exec=/usr/bin/\([a-z]*\)|Exec=\1|" \
              -e "s|^Icon=.*|Icon=cn.wps.Office$suffix|" \
              usr/share/applications/wps-office-$c.desktop \
              > /app/share/applications/cn.wps.Office$suffix.desktop; \
        done
      # 图标（12.x 新版 2023 系列，256px；主图标用合并模式 kprometheus）
      - |
        for pair in prometheus:kprometheus et:etmain wpp:wppmain pdf:pdfmain; do
          c=${pair%%:*}; m=${pair##*:}; \
          case $c in prometheus) suffix="";; *) suffix=".$c";; esac; \
          install -Dm644 usr/share/icons/hicolor/256x256/mimetypes/wps-office2023-$m.png \
            /app/share/icons/hicolor/256x256/apps/cn.wps.Office$suffix.png; \
        done
      - install -Dm644 files/cn.wps.Office.metainfo.xml
        /app/share/metainfo/cn.wps.Office.metainfo.xml
    sources:
      # WPS 12.x 国内版。官方 CDN 需签名 URL（见 scripts/fetch-wps.sh），
      # CI 在构建前下载到 downloads/。版本升级 = 改这里的文件名+sha256+workflow 里的版本变量。
      - type: file
        path: ../downloads/wps-office_12.1.2.28080_amd64.deb
        sha256: 2fa999f60a71e21093ab49ef6d7f61d7668c844bfebf30907d2c290e460f9be0
        dest-filename: wps.deb
      - type: dir
        path: ../files/wps
        dest: files
